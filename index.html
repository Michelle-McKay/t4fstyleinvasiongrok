<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1113">
<title>IRON MARCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="art.css">
</head>
<body>
<div id="app">
  <header id="top" class="glass">
    <div class="row1"><button class="port" id="port" data-a="drawer" data-id="hero" data-tab="forge"></button><button class="power" id="power" data-a="plot-cc"></button><button class="dbtn" id="dbtn" data-a="drawer" data-id="hero" data-tab="store"></button></div>
    <div class="chips num" id="chips"></div>
    <div id="prod"></div>
  </header>
  <main id="main">
    <section class="page on" id="pg-map">
      <canvas id="map"></canvas>
      <div class="mapui" id="compass"></div>
      <canvas class="mapui" id="mini" width="66" height="130"></canvas>
      <div class="mapui" id="mapchips"></div>
      <div class="mapui" id="coord"></div>
      <div id="radial"></div>
    </section>
    <section class="page" id="pg-base"></section>
    <div id="scrim"></div>
    <div class="sheet glass" id="sheet"></div>
    <div id="drawer" class="glass"><div id="dtabs"></div><div id="dbody"></div></div>
    <div id="toasts"></div>
  </main>
  <div id="qbar" class="glass"></div>
  <nav id="dock" class="glass"></nav>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".24"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
<linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".12"/><stop offset="1" stop-color="#000" stop-opacity=".4"/></linearGradient>
<linearGradient id="gT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="gCyl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset=".3" stop-color="#fff" stop-opacity=".3"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>
<radialGradient id="gGA"><stop offset="0" stop-color="#ffb84a" stop-opacity=".55"/><stop offset="1" stop-color="#ffb84a" stop-opacity="0"/></radialGradient><radialGradient id="gGI"><stop offset="0" stop-color="#5ec4d4" stop-opacity=".5"/><stop offset="1" stop-color="#5ec4d4" stop-opacity="0"/></radialGradient><radialGradient id="gGG"><stop offset="0" stop-color="#8ef0b0" stop-opacity=".5"/><stop offset="1" stop-color="#8ef0b0" stop-opacity="0"/></radialGradient></defs></svg>
<div id="hint"></div>
<div id="alarm"></div>
<div id="aura"></div>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/art2.js"></script>
<script src="js/art3.js"></script>
<script src="js/art4.js"></script>
<script src="js/art5.js"></script>
<script src="js/art6.js"></script>
<script src="js/art7.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
<script src="js/iap.js"></script>
<script src="js/packs.js"></script>
<script src="js/cc.js"></script>
<script src="js/bld.js"></script>
</body>
</html>
