<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0e1113">
<title>IRON MARCH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="top" class="glass">
    <div class="row1"><span class="mark">Iron March</span><span class="watch" id="watch"></span><span class="cc" id="cc"></span></div>
    <div class="chips num" id="chips"></div>
    <div id="ticker"></div>
  </header>
  <main id="main">
    <section class="page on" id="pg-map">
      <canvas id="map"></canvas>
      <div class="mapui" id="compass"></div>
      <canvas class="mapui" id="mini" width="66" height="130"></canvas>
      <div class="mapui" id="mapchips"></div>
      <div class="mapui" id="coord"></div>
      <div id="radial"></div>
    </section>
    <section class="page" id="pg-base"></section>
    <div id="scrim"></div>
    <div class="sheet glass" id="sheet"></div>
    <div id="drawer" class="glass"><div class="grab"><i></i></div><div id="dtabs"></div><div id="dbody"></div></div>
    <div id="toasts"></div>
  </main>
  <nav id="dock" class="glass"></nav>
</div>
<div id="alarm"></div>
<div id="aura"></div>
<script src="js/data.js"></script>
<script src="js/engine.js"></script>
<script src="js/art.js"></script>
<script src="js/map.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
